<!doctype html>
<html lang="ja">
  <head>
    <script
      src="https://kit.fontawesome.com/41a462ecdf.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <title>おむすびキッチンカー | OMUSUBI - Japanese Onigiri Food Truck</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>おむすびキッチンカー</h1>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h1>心と身体をやさしく結ぶ</h1>
        <p>握りたてのおにぎり</p>
      </div>
    </section>

    <section class="concept">
      <div class="concept-text">
        <h1>こだわり</h1>
        <h2>旬の食材×麹×良い水</h2>
        <a
          class="order-btn"
          href="https://www.instagram.com/sayuri.somachi?igsh=a3cwZjZqZzJwb2Uz"
          target="_blank"
        >
          <i class="fa-brands fa-instagram"></i>
          <span>詳細はこちらから</span>
        </a>
      </div>
    </section>

    <section class="menu">
      <div class="menu-title">
        <h1>メニュー</h1>
        <ul class="menu-list">
          <li class="menu-item">
            <img
              class="omusubi-pic"
              src="images/comingsoon.jpeg"
              alt="coming soon"
            />
            <p>鮭</p>
            <p>¥300</p>
          </li>

          <li class="menu-item">
            <img
              class="omusubi-pic"
              src="images/comingsoon.jpeg"
              alt="coming soon"
            />
            <p>おかか</p>
            <p>¥300</p>
          </li>

          <li class="menu-item">
            <img
              class="omusubi-pic"
              src="images/comingsoon.jpeg"
              alt="coming soon"
            />
            <p>たらこ</p>
            <p>¥300</p>
          </li>
        </ul>
      </div>
    </section>

    <section class="schedule" id="schedule">
      <div class="hours">
        <h2>出店スケジュール</h2>
        <ul class="schedule-list">
          <li><span>月〜金</span> 11:00-14:00</li>
          <li><span>土・日</span> 10:00-15:00</li>
        </ul>
      </div>

      <div class="map-section">
        <h2>アクセス</h2>
        <div class="map-frame">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3249.038144724563!2d140.0395487107362!3d35.47860004096544!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60229e412b07fccd%3A0xdf2e4090e3649f51!2sAnegasaki%20Station!5e0!3m2!1sen!2sjp!4v1772105867902!5m2!1sen!2sjp"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </section>

    <footer>
      <div class="footer-inner">
        <p class="footer-logo">© 2025 おむすびキッチンカー</p>
      </div>
    </footer>
  </body>
</html>
