<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Omusubi Food Truck</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>おむすびキッチンカー</h1>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h1>心と身体をやさしく結ぶ</h1>
        <p>握りたてのおにぎり</p>
      </div>
    </section>

    <section class="concept">
      <div class="concept-text">
        <h1>Concept</h1>
        <h2>旬の食材×麹×良い水</h2>
      </div>
    </section>

    <section class="menu">
      <div class="menu-title">
        <h1>Menu</h1>
        <ul class="menu-list">
          <li class="menu-item">
            <img class="omusubi-pic" src="#" />
            <p>鮭</p>
            <p>¥</p>
          </li>

          <li class="menu-item">
            <img class="omusubi-pic" src="#" />
            <p>おかか</p>
            <p>¥</p>
          </li>

          <li class="menu-item">
            <img class="omusubi-pic" src="#" />
            <p>たらこ</p>
            <p>¥</p>
          </li>
        </ul>
      </div>
    </section>

    <section class="schedule">
      <h2>Schedule</h2>
      <p></p>
    </section>

    <section class="order"></section>

    <footer></footer>
  </body>
</html>
