<!doctype html>
<html lang="ja">
  <head>
    <script
      src="https://kit.fontawesome.com/41a462ecdf.js"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <title>Omusubi Food Truck</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>おむすびキッチンカー</h1>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h1>心と身体をやさしく結ぶ</h1>
        <p>握りたてのおにぎり</p>
      </div>
    </section>

    <section class="concept">
      <div class="concept-text">
        <h1>こだわり</h1>
        <h2>旬の食材×麹×良い水</h2>
        <a
          class="order-btn"
          href="https://www.instagram.com/sayuri.somachi?igsh=a3cwZjZqZzJwb2Uz"
          target="_blank"
        >
          <i class="fa-brands fa-instagram"></i>
          <span>詳細はこちらから</span>
        </a>
      </div>
    </section>

    <section class="menu">
      <div class="menu-title">
        <h1>メニュー</h1>
        <ul class="menu-list">
          <li class="menu-item">
            <img class="omusubi-pic" src="#" />
            <p>鮭</p>
            <p>¥</p>
          </li>

          <li class="menu-item">
            <img class="omusubi-pic" src="#" />
            <p>おかか</p>
            <p>¥</p>
          </li>

          <li class="menu-item">
            <img class="omusubi-pic" src="#" />
            <p>たらこ</p>
            <p>¥</p>
          </li>
        </ul>
      </div>
    </section>

    <section class="schedule">
      <h2>出店スケジュール</h2>
      <p class="schedule-info">営業時間</p>
      <p class="schedule-info">住所</p>
    </section>

    <section class="order"></section>

    <footer></footer>
  </body>
</html>
